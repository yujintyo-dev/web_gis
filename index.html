<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>公開型GIS</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; connect-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 地図(印刷プレビュー時は、この用紙のかたちに変わります) -->
  <div id="sheet">
    <div id="print-head"><div id="ph-title"></div><div id="ph-meta"></div></div>
    <div id="map"></div>
    <div id="print-foot"><div id="pf-legend"></div><div id="pf-notes"></div></div>
  </div>

  <!-- 検索ボックス -->
  <div id="search-box">
    <form id="search-form" autocomplete="off">
      <input id="search-input" type="search" placeholder="地番を検索(例: 1117-18)" aria-label="地番検索">
      <button type="submit" aria-label="検索">検索</button>
    </form>
    <div id="search-hint" hidden></div>
    <ul id="search-results" hidden></ul>
  </div>

  <!-- 右上ボタン -->
  <div id="buttons">
    <button id="btn-layers" aria-label="レイヤー">☰</button>
    <button id="btn-locate" aria-label="現在地">◎</button>
    <button id="btn-print" aria-label="印刷" title="地図を印刷する">印刷</button>
  </div>

  <!-- レイヤーパネル -->
  <aside id="panel" hidden>
    <div class="panel-head">
      <strong>レイヤー</strong>
      <button id="panel-close" aria-label="閉じる">✕</button>
    </div>
    <h3>背景</h3>
    <div id="base-list"></div>
    <h3>表示レイヤー</h3>
    <div id="layer-list"></div>
    <p class="panel-foot"><a href="terms.html" target="_blank" rel="noopener">利用規約</a></p>
  </aside>

  <div id="status"></div>

  <!-- 画面下の案内帯(上段: 表示中のレイヤーの注意事項 / 下段: 参考図の案内。クリックで利用規約へ) -->
  <div id="notice">
    <div id="notice-notes" hidden><span class="nn-lead">表示中の地図の注意事項</span><span id="nn-list"></span></div>
    <a id="notice-main" href="terms.html" target="_blank" rel="noopener"><span id="notice-text">この地図情報は、あくまでも参考図であり、全ての内容を表示しているものではありません。法的な図面や詳細図面等の閲覧、正確な情報につきましては、担当課にてご確認ください。</span> <span class="notice-link">▶ 利用規約</span></a>
  </div>

  <!-- 注意事項のウィンドウ -->
  <div id="note-modal" hidden>
    <div class="nm-box" role="dialog" aria-modal="true" aria-labelledby="nm-title">
      <div class="nm-head"><span class="nm-icon">⚠</span><strong id="nm-title">注意事項</strong><button id="nm-close" type="button" aria-label="閉じる">✕</button></div>
      <div id="nm-tabs" role="tablist" hidden></div>
      <div id="nm-layers" hidden></div>
      <div id="nm-body" class="doc"></div>
      <div class="nm-foot">
        <a id="nm-open" href="terms.html" target="_blank" rel="noopener">利用規約・注意事項のページで見る</a>
        <button id="nm-ok" type="button">確認しました</button>
      </div>
    </div>
  </div>

  <!-- 印刷プレビューの操作バー(印刷プレビュー中だけ表示) -->
  <div id="print-bar">
    <strong>印刷</strong>
    <label>用紙 <select id="pp-size"><option value="A4">A4</option><option value="A3">A3</option></select></label>
    <label>向き <select id="pp-orient"><option value="landscape">横</option><option value="portrait">縦</option></select></label>
    <label>タイトル <input id="pp-title" type="text" placeholder="(空欄なら、サイト名)" maxlength="60"></label>
    <label><input id="pp-legend" type="checkbox" checked> 凡例</label>
    <span id="pp-state"></span>
    <button id="pp-print" type="button" class="pp-main">印刷する</button>
    <button id="pp-close" type="button">閉じる</button>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
