<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>管理画面 - 公開型GIS</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; connect-src 'self' https://api.github.com">
  <meta name="referrer" content="no-referrer">
  <script src="js/guard.js"></script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header id="top">
    <strong>管理画面</strong>
    <span id="state"></span>
    <span class="sp"></span>
    <a href="./" target="_blank" rel="noopener">公開サイトを開く</a>
    <button id="btn-dl" type="button">設定をダウンロード</button>
    <button id="btn-save" type="button" class="primary">GitHubに保存</button>
  </header>
  <main>
    <nav id="tree"></nav>
    <section id="editor"></section>
  </main>

  <div id="modal" hidden>
    <div class="modal-box">
      <h2>GitHubに保存</h2>
      <p class="help">保存すると <code>config.json</code> が更新され、数分後に公開サイトへ反映されます。<br>
        トークンの作り方は README の「管理画面」を見てください。<br>トークンは<b>このブラウザの外に保存されません</b>(記憶してもタブを閉じると消えます)。</p>
      <label class="row"><span class="lb">ユーザー名/組織名</span><input id="gh-owner" type="text"></label>
      <label class="row"><span class="lb">リポジトリ名</span><input id="gh-repo" type="text"></label>
      <label class="row"><span class="lb">ブランチ</span><input id="gh-branch" type="text" value="main"></label>
      <label class="row"><span class="lb">トークン</span><input id="gh-token" type="password" autocomplete="off"></label>
      <label class="row"><span class="lb"></span><span><input id="gh-remember" type="checkbox"> このタブを閉じるまで記憶する</span></label>
      <p id="gh-msg" class="msg"></p>
      <div class="modal-actions">
        <button id="gh-cancel" type="button">閉じる</button>
        <button id="gh-run" type="button" class="primary">保存する</button>
      </div>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
